{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Sign In | Trinials</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-canvas: #E8E9E4;
            --bg-card: #FFFFFF;
            --border-card: #D4DEC0;
            --border-focus: #58641D;
            --text-title: #002400;
            --text-body: #273B09;
            --text-muted: #58641D;
            --primary-green: #273B09;
            --primary-hover: #002400;
            --accent-green: #BBCF8D;
            --danger: #dc2626;
            --danger-bg: #fef2f2;
            --danger-border: #fecaca;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #F5F6F2 0%, #E8E9E4 50%, #DFE3D6 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-body);
        }
        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            box-shadow: 0 10px 40px rgba(0, 36, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 44px 36px;
            text-align: center;
        }
        .logo-wrap {
            margin-bottom: 24px;
            display: inline-block;
        }
        .logo-wrap img {
            height: 48px;
            width: auto;
        }
        .portal-title {
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: var(--text-title);
        }
        .portal-sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.5;
        }
        .alert {
            background: var(--danger-bg);
            border: 1px solid var(--danger-border);
            color: var(--danger);
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-title);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: #F8FAF6;
            border: 1px solid var(--border-card);
            border-radius: 10px;
            font-size: 14px;
            color: var(--text-title);
            outline: none;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            background: #FFFFFF;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(88, 100, 29, 0.15);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--primary-green);
            color: #FFFFFF;
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(39, 59, 9, 0.25);
        }
        .btn-submit:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 36, 0, 0.3);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .back-home {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-home:hover {
            color: var(--text-title);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-wrap">
            <img src="{% static 'images/logo-dark.png' %}" alt="Trinials">
        </div>
        <h1 class="portal-title">Operations Console</h1>
        <p class="portal-sub">Sign in to manage client inquiries, analytics & email dispatches</p>

        {% if error %}
        <div class="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'website:admin_login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="form-group">
                <label class="form-label" for="username">Admin Email</label>
                <input class="form-input" type="email" id="username" name="username" required autofocus autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Sign In to Console →</button>
        </form>

        <a href="/" class="back-home">← Return to Trinials Website</a>
    </div>
</body>
</html>
