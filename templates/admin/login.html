{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal Login | Trinials</title>
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #001700;
            --bg-card: #042104;
            --border-card: #153815;
            --text-light: #F4F7F2;
            --text-muted: #9EAB95;
            --accent-green: #BBCF8D;
            --accent-bright: #38ef7d;
            --accent-glow: rgba(187, 207, 141, 0.2);
            --danger: #ef4444;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 20%, #0d300d 0%, var(--bg-dark) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: var(--text-light);
        }
        .login-card {
            background: rgba(4, 33, 4, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-card);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 40px rgba(187, 207, 141, 0.08);
            border-radius: 20px;
            width: 100%;
            max-width: 420px;
            padding: 40px 32px;
            text-align: center;
        }
        .logo-wrap {
            margin-bottom: 24px;
            display: inline-block;
        }
        .logo-wrap img {
            height: 48px;
            width: auto;
        }
        .portal-title {
            font-family: 'Manrope', sans-serif;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            color: #FFFFFF;
        }
        .portal-sub {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }
        .alert {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 20px;
            text-align: left;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            padding: 13px 16px;
            background: rgba(0, 15, 0, 0.6);
            border: 1px solid var(--border-card);
            border-radius: 10px;
            font-size: 14px;
            color: #FFFFFF;
            outline: none;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: var(--accent-green);
            color: #002400;
            font-family: 'Manrope', sans-serif;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-submit:hover {
            background: #cbdca3;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(187, 207, 141, 0.3);
        }
        .btn-submit:active {
            transform: translateY(0);
        }
        .back-home {
            display: inline-block;
            margin-top: 24px;
            font-size: 13px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
        }
        .back-home:hover {
            color: var(--accent-green);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-wrap">
            <img src="{% static 'images/logo-dark.png' %}" alt="Trinials">
        </div>
        <h1 class="portal-title">Enquiry Admin Portal</h1>
        <p class="portal-sub">Sign in to manage client inquiries & email dispatches</p>

        {% if error %}
        <div class="alert">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'website:admin_login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next_url }}">
            <div class="form-group">
                <label class="form-label" for="username">Username or Email</label>
                <input class="form-input" type="text" id="username" name="username" placeholder="admin or trinial26@gmail.com" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input class="form-input" type="password" id="password" name="password" placeholder="••••••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn-submit">Sign In to Dashboard →</button>
        </form>

        <a href="/" class="back-home">← Back to Trinials Website</a>
    </div>
</body>
</html>
